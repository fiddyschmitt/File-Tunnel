# Written by the File Tunnel lab's playbook: anonymous FTP for ft's --ftp rows.
listen=YES
listen_ipv6=NO

# Anonymous access, rooted at /srv/ftp/pub
anonymous_enable=YES
no_anon_password=YES
anon_root=/srv/ftp/pub

# Reading and directory listing (downloads)
download_enable=YES
dirlist_enable=YES
anon_world_readable_only=YES

# Writing to a subfolder (uploads/)
write_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES

# Uploaded files are world-readable, so they can be downloaded
anon_umask=022
file_open_mode=0644

# Passive mode, for client compatibility
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
